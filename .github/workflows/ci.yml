name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # 静态检查 + 全部 bats。参数不在这里重复一遍，
  # 一律走 ./run-tests.sh，避免 CI 与本地的检查口径漂移。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shfmt 版本必须钉死：用 releases/latest/download/ 需要文件名里带上
      # 最新的版本号，写死某个版本号就会在下一次发布时 404（curl exit 22）。
      # 钉死同时也避免新版格式规则一改就把 CI 弄红。
      - name: 安装 shellcheck / shfmt / bats
        env:
          SHFMT_VERSION: v3.14.0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt && sudo mv /tmp/shfmt /usr/local/bin/shfmt
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          # 装没装上，现在就说清楚，而不是等 run-tests.sh 静默回落到 docker
          shellcheck --version | head -2
          shfmt --version
          bats --version

      - run: ./run-tests.sh

  # 真实安装路径只在容器里跑：不污染 runner，同时证明
  # 「一台干净机器上 curl | bash」这个主要分发场景是通的。
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # fedora 在这里的作用是证明包管理器那层抽象是真的：
        # 脚本以前硬写 apt-get，非 Debian 系跑到「安装 tmux」就失败，
        # 而失败信息看起来像 tmux 装不上，不像「不认识 dnf」。
        # pacman / zypper 分支没有容器覆盖，只有单元测试。
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, fedora:40]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: 准备最小环境
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq bash ca-certificates git sudo
          else
            # procps-ng：socket 清理那一步要用 pgrep
            dnf install -y -q bash ca-certificates git sudo procps-ng findutils
          fi

      - uses: actions/checkout@v4

      # 字体在这里跳过：每个容器各拉一遍上百 MB 的 zip，既慢又把 CI 的
      # 绿灯绑到 nerd-fonts 的发布页和限速上。字体单独在下面一个容器里测。
      - name: 非交互安装推荐配置
        run: bash TMUX.sh --preset recommended --set tmux.font=skip --yes

      - name: 校验产物
        run: |
          test -f "$HOME/.tmux.conf"
          grep -q '由 TMUX.sh 生成' "$HOME/.tmux.conf"
          grep -q "@plugin 'tmux-plugins/tpm'" "$HOME/.tmux.conf"
          tmux -V

      # 字体是唯一会往 ~/.local/share/fonts 写东西的步骤，只有真跑一次
      # 才能发现「zip 换了目录结构」这类问题。一个容器足够。
      - name: 安装并校验 Nerd Font（只在一个镜像上跑）
        if: matrix.image == 'ubuntu:24.04'
        # 容器里 run: 默认落到 dash，这一步用了 here-string（<<<）—— 那是 bash
        # 特性，dash 会报「redirection unexpected」退 2，而且是在断言之前就死掉，
        # 看起来像字体装失败。其他步骤能过只是因为它们碰巧全是 POSIX 写法。
        shell: bash
        run: |
          bash TMUX.sh --set tmux.profile=custom --set tmux.font=jetbrains \
            --only tmux.font --yes
          dir="$HOME/.local/share/fonts/JetBrainsMono"
          ls "$dir"/*.ttf >/dev/null
          # 断言的是 fontconfig 认到的**族名**，不是文件名：设置里的字体选择框
          # 列的就是族名。两个都必须在 ——
          #   JetBrainsMono Nerd Font Mono  终端该选的那个
          #   JetBrainsMono Nerd Font       文档和搜索框里用的名字
          # 曾经只解 Mono 变体，于是用户搜「JetBrainsMono Nerd Font」什么都搜不到，
          # 合理地以为字体没装上。这条断言就是防它回归。
          fams=$(fc-list --format '%{family[0]}\n' | sort -u)
          for f in 'JetBrainsMono Nerd Font' 'JetBrainsMono Nerd Font Mono'; do
            grep -qxF "$f" <<< "$fams" || {
              echo "fontconfig 里没有族名：$f"
              grep -i jetbrains <<< "$fams" || echo "（一个 JetBrains 族都没有）"
              exit 1
            }
          done
          # 只该解出两个族各四个常规字重，正好 8 个文件。
          # 整包是 96 个 ttf / 233 MB，这条断言就是防止筛选被写坏后悄悄退回整包。
          n=$(find "$dir" -name '*.ttf' | wc -l)
          test "$n" -eq 8 || { echo "解出了 $n 个字体文件，筛选失效"; exit 1; }
          # 无连字的 NL 副本要被排除：它只是又两个几乎同名的族，把选择框搞乱
          nl=$(find "$dir" -name '*NL*' | wc -l)
          test "$nl" -eq 0 || { echo "NL 变体没被排除（$nl 个）"; exit 1; }
          # 幂等：第二次应当直接跳过，而不是再下一遍
          bash TMUX.sh --set tmux.profile=custom --set tmux.font=jetbrains \
            --only tmux.font --yes 2>&1 | grep -q '已安装'
