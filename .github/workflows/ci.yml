name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # 静态检查 + 全部 bats。参数不在这里重复一遍，
  # 一律走 ./run-tests.sh，避免 CI 与本地的检查口径漂移。
  check:
    runs-on: ubuntu-latest
    steps:
      # v4 跑在 Node 20 上，runner 已经在强制降级并每次都留一条弃用告警；
      # 下一步就是直接不能用。v5 只是换了 Node 运行时，用法一样。
      - uses: actions/checkout@v5

      # shfmt 版本必须钉死：用 releases/latest/download/ 需要文件名里带上
      # 最新的版本号，写死某个版本号就会在下一次发布时 404（curl exit 22）。
      # 钉死同时也避免新版格式规则一改就把 CI 弄红。
      # bats 同理：clone master 等于让上游的任意一次提交决定我们的 CI 红绿。
      - name: 安装 shellcheck / shfmt / bats
        env:
          SHFMT_VERSION: v3.14.0
          BATS_VERSION: v1.14.0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt && sudo mv /tmp/shfmt /usr/local/bin/shfmt
          git clone --depth 1 --branch "$BATS_VERSION" \
            https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          # 装没装上，现在就说清楚，而不是等 run-tests.sh 静默回落到 docker
          shellcheck --version
          shfmt --version
          bats --version

      - run: ./run-tests.sh

  # 真实安装路径只在容器里跑：不污染 runner，同时证明
  # 「一台干净机器上 curl | bash」这个主要分发场景是通的。
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # fedora 在这里的作用是证明包管理器那层抽象是真的：
        # 脚本以前硬写 apt-get，非 Debian 系跑到「安装 tmux」就失败，
        # 而失败信息看起来像 tmux 装不上，不像「不认识 dnf」。
        # pacman / zypper 分支没有容器覆盖，只有单元测试。
        #
        # fedora 用还在支持期的版本：EOL 之后镜像还在，但仓库元数据迟早
        # 被挪进 archive，那时 dnf install 会 404，而这跟脚本没有关系。
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, fedora:44]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: 准备最小环境
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq bash ca-certificates git sudo
          else
            # procps-ng：socket 清理那一步要用 pgrep
            dnf install -y -q bash ca-certificates git sudo procps-ng findutils
          fi

      - uses: actions/checkout@v5

      # 字体在这里跳过：每个容器各拉一遍上百 MB 的 zip，既慢又把 CI 的
      # 绿灯绑到 nerd-fonts 的发布页和限速上。字体单独在下面一个容器里测。
      - name: 非交互安装推荐配置
        run: bash TMUX.sh --preset recommended --set tmux.font=skip --yes

      - name: 校验产物
        run: |
          test -f "$HOME/.tmux.conf"
          grep -q '由 TMUX.sh 生成' "$HOME/.tmux.conf"
          grep -q "@plugin 'tmux-plugins/tpm'" "$HOME/.tmux.conf"
          tmux -V

      # 每个发行版都真实走一次 ZSH.sh 自己的包管理器层。--only 保证这里只验证
      # 系统包，不让四个容器重复克隆主题和插件。
      - name: 通过包管理器安装并校验 Zsh
        shell: bash
        run: |
          bash ZSH.sh --preset recommended --only zsh.package --yes
          zsh --version

      # ZSH.sh 是独立安装器：这里不借用 TMUX.sh 的函数或状态。
      # 包管理器路径由 tmux job 已覆盖；本步聚焦 Oh My Zsh、主题、插件和配置产物。
      - name: 非交互安装 Zsh 推荐配置
        if: matrix.image == 'ubuntu:24.04'
        shell: bash
        run: |
          bash ZSH.sh --preset recommended --set zsh.install=skip \
            --set zsh.font=skip --set zsh.default_shell=no --yes
          test -f "$HOME/.zshrc"
          test -d "$HOME/.oh-my-zsh/.git"
          test -d "$HOME/.oh-my-zsh/custom/themes/powerlevel10k/.git"
          test -d "$HOME/.oh-my-zsh/custom/plugins/zsh-autosuggestions/.git"
          test -d "$HOME/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting/.git"
          grep -q 'ZSH_THEME="powerlevel10k/powerlevel10k"' "$HOME/.zshrc"
          grep -q 'plugins=(git zsh-autosuggestions z extract zsh-syntax-highlighting)' "$HOME/.zshrc"
          grep -q 'source "$HOME/.p10k.zsh"' "$HOME/.zshrc"
          out=$(bash dot.sh --list)
          grep -q ZSH.sh <<< "$out"

      # 字体是唯一会往 ~/.local/share/fonts 写东西的步骤，只有真跑一次
      # 才能发现「zip 换了目录结构」这类问题。一个容器足够。
      - name: 安装并校验 Nerd Font（只在一个镜像上跑）
        if: matrix.image == 'ubuntu:24.04'
        # 容器里 run: 默认落到 dash，这一步用了 here-string（<<<）—— 那是 bash
        # 特性，dash 会报「redirection unexpected」退 2，而且是在断言之前就死掉，
        # 看起来像字体装失败。其他步骤能过只是因为它们碰巧全是 POSIX 写法。
        shell: bash
        run: |
          bash TMUX.sh --set tmux.profile=custom --set tmux.font=jetbrains \
            --only tmux.font --yes
          dir="$HOME/.local/share/fonts/JetBrainsMono"
          ls "$dir"/*.ttf >/dev/null
          # 断言的是 fontconfig 认到的**族名**，不是文件名：设置里的字体选择框
          # 列的就是族名。两个都必须在 ——
          #   JetBrainsMono Nerd Font Mono  终端该选的那个
          #   JetBrainsMono Nerd Font       文档和搜索框里用的名字
          # 曾经只解 Mono 变体，于是用户搜「JetBrainsMono Nerd Font」什么都搜不到，
          # 合理地以为字体没装上。这条断言就是防它回归。
          fams=$(fc-list --format '%{family[0]}\n' | sort -u)
          for f in 'JetBrainsMono Nerd Font' 'JetBrainsMono Nerd Font Mono'; do
            grep -qxF "$f" <<< "$fams" || {
              echo "fontconfig 里没有族名：$f"
              grep -i jetbrains <<< "$fams" || echo "（一个 JetBrains 族都没有）"
              exit 1
            }
          done
          # 只该解出两个族各四个常规字重，正好 8 个文件。
          # 整包是 96 个 ttf / 233 MB，这条断言就是防止筛选被写坏后悄悄退回整包。
          n=$(find "$dir" -name '*.ttf' | wc -l)
          test "$n" -eq 8 || { echo "解出了 $n 个字体文件，筛选失效"; exit 1; }
          # 无连字的 NL 副本要被排除：它只是又两个几乎同名的族，把选择框搞乱
          nl=$(find "$dir" -name '*NL*' | wc -l)
          test "$nl" -eq 0 || { echo "NL 变体没被排除（$nl 个）"; exit 1; }
          # 幂等：第二次应当直接跳过，而不是再下一遍。
          #
          # 先把输出收进变量，再用 here-string 匹配 —— 不写成
          # `bash TMUX.sh ... | grep -q`：grep -q 命中就立刻退出，脚本还在写
          # stdout，于是吃到 SIGPIPE 退 141；shell: bash 带 -o pipefail，
          # 整步就红在一个「其实是通过了」的断言上。脚本里避开的就是这一类。
          out=$(bash TMUX.sh --set tmux.profile=custom --set tmux.font=jetbrains \
            --only tmux.font --yes 2>&1)
          grep -q '跳过下载' <<< "$out" || {
            echo "第二次运行没有跳过下载："; printf '%s\n' "$out"; exit 1
          }
          # 反向断言：命中「跳过」的同时绝不该再出现下载动作
          ! grep -q '正在下载' <<< "$out" || {
            echo "已装好却又下载了一遍："; printf '%s\n' "$out"; exit 1
          }
