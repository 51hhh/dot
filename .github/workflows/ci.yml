name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # 静态检查 + 全部 bats。参数不在这里重复一遍，
  # 一律走 ./run-tests.sh，避免 CI 与本地的检查口径漂移。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 shellcheck / shfmt / bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/latest/download/shfmt_v3.8.0_linux_amd64
          chmod +x /tmp/shfmt && sudo mv /tmp/shfmt /usr/local/bin/shfmt
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - run: ./run-tests.sh

  # 真实安装路径只在容器里跑：不污染 runner，同时证明
  # 「一台干净机器上 curl | bash」这个主要分发场景是通的。
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:12]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: 准备最小环境
        run: |
          apt-get update -qq
          apt-get install -y -qq bash ca-certificates git sudo

      - uses: actions/checkout@v4

      - name: 非交互安装推荐配置
        run: bash TMUX.sh --preset recommended --yes

      - name: 校验产物
        run: |
          test -f "$HOME/.tmux.conf"
          grep -q '由 TMUX.sh 生成' "$HOME/.tmux.conf"
          grep -q "@plugin 'tmux-plugins/tpm'" "$HOME/.tmux.conf"
          tmux -V
